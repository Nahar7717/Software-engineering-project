name: Java CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # ── Compile ──────────────────────────────────────────────────────────
      - name: Compile
        run: mvn -B compile --file pom.xml

      # ── Functional & Non-Functional Tests ────────────────────────────────
      - name: Run tests
        run: mvn -B test --file pom.xml

      # ── Upload test report (always, so failures are visible) ──────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

      # ── Package (skip tests — already ran) ───────────────────────────────
      - name: Package fat-JAR
        run: mvn -B package -DskipTests --file pom.xml

      # ── Upload runnable JAR as build artifact ─────────────────────────────
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ride-sharing-jar
          path: target/ride-sharing-jar-with-dependencies.jar
          if-no-files-found: error
